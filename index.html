<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETHIOTOP100 | Ethiopian Music Charts</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b0f17;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- HEADER WITH CUSTOM ETHIOTOP100 COLOR LOGO -->
  <header class="border-b border-gray-800 bg-gray-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <!-- LOGO: ETHIO (Sky Blue), T (Green), O (Yellow), P (Red), 100 (White) -->
        <h1 class="text-3xl font-black tracking-widest uppercase">
          <span class="text-sky-400">ETHIO</span><span class="text-emerald-500">T</span><span class="text-amber-400">O</span><span class="text-red-500">P</span><span class="text-white">100</span>
        </h1>
      </div>
      <button onclick="loadAllCharts()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-lg border border-gray-700 transition">
        <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Charts
      </button>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 mt-8 space-y-10">

    <!-- TOP BANNER ROW: YEARLY TOP 100 ETHIOPIAN MUSIC SPOTLIGHT -->
    <section class="bg-gradient-to-r from-red-950/40 via-amber-950/30 to-emerald-950/40 border border-amber-500/30 rounded-2xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <div>
          <span class="text-xs font-bold text-amber-400 tracking-widest uppercase">Annual Leaderboard</span>
          <h2 class="text-2xl font-black text-white flex items-center gap-2">
            <i class="fa-solid fa-crown text-amber-400"></i> Yearly Top 100 Ethiopian Music
          </h2>
        </div>
        <span class="text-xs text-gray-400">Updated for 2026</span>
      </div>

      <!-- Horizontal Scrollable Row for Yearly Chart -->
      <div id="yearly-chart" class="flex gap-4 overflow-x-auto pb-4 scrollbar-thin scrollbar-thumb-gray-800">
        <div class="text-gray-500 text-sm">Loading Yearly Top 100...</div>
      </div>
    </section>

    <!-- 3-COLUMN GRID SECTION: WEEKLY, MONTHLY, 3-MONTH -->
    <section>
      <h2 class="text-xl font-bold mb-6 text-gray-200 border-l-4 border-amber-400 pl-3">Trending Period Charts</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- COLUMN 1: WEEKLY TOP 10 -->
        <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-5 flex flex-col">
          <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-4">
            <h3 class="font-black text-lg text-emerald-400 flex items-center gap-2">
              <i class="fa-solid fa-bolt"></i> Weekly Top 10
            </h3>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">Live</span>
          </div>
          <div id="weekly-chart" class="space-y-3 flex-1">
            <div class="text-gray-500 text-sm">Loading Weekly Top 10...</div>
          </div>
        </div>

        <!-- COLUMN 2: MONTHLY TOP 100 -->
        <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-5 flex flex-col">
          <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-4">
            <h3 class="font-black text-lg text-amber-400 flex items-center gap-2">
              <i class="fa-solid fa-calendar-days"></i> Monthly Top 100
            </h3>
            <span class="text-xs bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">Monthly</span>
          </div>
          <div id="monthly-chart" class="space-y-3 flex-1 max-h-[700px] overflow-y-auto pr-1">
            <div class="text-gray-500 text-sm">Loading Monthly Top 100...</div>
          </div>
        </div>

        <!-- COLUMN 3: 3-MONTH TOP 100 -->
        <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-5 flex flex-col">
          <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-4">
            <h3 class="font-black text-lg text-sky-400 flex items-center gap-2">
              <i class="fa-solid fa-chart-line"></i> 3-Month Top 100
            </h3>
            <span class="text-xs bg-sky-500/10 text-sky-400 px-2 py-0.5 rounded border border-sky-500/20">Quarterly</span>
          </div>
          <div id="three-month-chart" class="space-y-3 flex-1 max-h-[700px] overflow-y-auto pr-1">
            <div class="text-gray-500 text-sm">Loading 3-Month Top 100...</div>
          </div>
        </div>

      </div>
    </section>

  </div>

  <script>
    // YOUR GOOGLE APPS SCRIPT WEB APP DEPLOYMENT URL
    const BASE_API_URL = "https://script.google.com/macros/s/AKfycby4DrnhQ39ifM7oEKI5vavh5W-bMQRUSoVl2QWK0Cww9Vcmanev727TWiW0ja4LIatA/exec?action=getChart";

    async function fetchChartData(timeframe) {
      try {
        const response = await fetch(`${BASE_API_URL}&timeframe=${timeframe}`);
        return await response.json();
      } catch (error) {
        console.error(`Error loading ${timeframe} chart:`, error);
        return [];
      }
    }

    function createTrackCardHTML(track, showHorizontal = false) {
      // Direct YouTube Redirect URL
      const ytUrl = track.youtube_url || `https://www.youtube.com/results?search_query=${encodeURIComponent(track.title + ' ' + track.artist)}`;

      if (showHorizontal) {
        return `
          <a href="${ytUrl}" target="_blank" class="flex-shrink-0 w-48 bg-gray-900 border border-gray-800 hover:border-amber-500/50 rounded-xl p-3 transition group block">
            <div class="w-full h-32 bg-gray-800 rounded-lg overflow-hidden relative mb-2">
              <img src="${track.cover_art || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
              <span class="absolute top-2 left-2 bg-black/80 text-amber-400 text-xs font-black px-2 py-0.5 rounded">#${track.rank}</span>
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                <i class="fa-brands fa-youtube text-red-500 text-3xl"></i>
              </div>
            </div>
            <h4 class="font-bold text-sm text-white truncate group-hover:text-amber-400">${track.title}</h4>
            <p class="text-xs text-gray-400 truncate">${track.artist}</p>
          </a>
        `;
      }

      return `
        <a href="${ytUrl}" target="_blank" class="bg-gray-900/80 hover:bg-gray-800 border border-gray-800 hover:border-gray-700 rounded-xl p-3 transition flex items-center justify-between group block">
          <div class="flex items-center space-x-3 overflow-hidden">
            <span class="text-sm font-black w-5 text-center text-gray-400 group-hover:text-amber-400">${track.rank}</span>
            <div class="w-10 h-10 bg-gray-800 rounded-lg overflow-hidden flex-shrink-0 relative">
              <img src="${track.cover_art || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
            </div>
            <div class="truncate">
              <h4 class="font-bold text-sm text-white truncate group-hover:text-amber-400">${track.title}</h4>
              <p class="text-xs text-gray-400 truncate">${track.artist}</p>
            </div>
          </div>
          <div class="flex items-center space-x-2 flex-shrink-0 pl-2">
            <span class="text-red-500 group-hover:scale-110 transition"><i class="fa-brands fa-youtube text-lg"></i></span>
          </div>
        </a>
      `;
    }

    async function loadAllCharts() {
      // 1. Fetch Weekly Chart
      const weeklyData = await fetchChartData("weekly");
      document.getElementById("weekly-chart").innerHTML = weeklyData.length > 0 
        ? weeklyData.map(t => createTrackCardHTML(t)).join('') 
        : `<div class="text-xs text-gray-500">No weekly entries found.</div>`;

      // 2. Fetch Monthly Chart
      const monthlyData = await fetchChartData("monthly");
      document.getElementById("monthly-chart").innerHTML = monthlyData.length > 0 
        ? monthlyData.map(t => createTrackCardHTML(t)).join('') 
        : `<div class="text-xs text-gray-500">No monthly entries found.</div>`;

      // 3. Fetch 3-Month Chart
      const threeMonthData = await fetchChartData("3month");
      document.getElementById("three-month-chart").innerHTML = threeMonthData.length > 0 
        ? threeMonthData.map(t => createTrackCardHTML(t)).join('') 
        : `<div class="text-xs text-gray-500">No 3-month entries found.</div>`;

      // 4. Fetch Yearly Chart
      const yearlyData = await fetchChartData("yearly");
      document.getElementById("yearly-chart").innerHTML = yearlyData.length > 0 
        ? yearlyData.map(t => createTrackCardHTML(t, true)).join('') 
        : `<div class="text-xs text-gray-500">No yearly entries found.</div>`;
    }

    // Initialize on page load
    loadAllCharts();
  </script>
</body>
</html>
